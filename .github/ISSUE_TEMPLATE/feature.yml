name: Feature request
description: Propose a bounded product or engineering capability
title: "[FEATURE] "
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the problem, not a presumed implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Testable acceptance criteria
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Data, security, privacy and operational risks
    validations:
      required: true
